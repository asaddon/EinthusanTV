<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KV Telemetry & Cache Explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            background-attachment: fixed;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 2rem auto;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .metric-card {
            align-items: center;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 3rem;
            font-weight: 700;
            display: flex;
            align-items: baseline;
            gap: 0.25rem;
        }

        .card-value span {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .reads .card-value { color: var(--accent-blue); }
        .writes .card-value { color: var(--accent-purple); }
        .hits .card-value { color: var(--accent-green); }
        
        .charts-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto 2rem auto;
        }
        
        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }
        
        .chart-wrapper {
            position: relative;
            height: 300px;
            width: 100%;
        }
        
        .cache-explorer {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .cache-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        button {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }
        
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        
        .explorer-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.5rem;
            height: 500px;
        }

        .explorer-grid > .card {
            min-height: 0; /* Prevents grid blowout */
            height: 100%;
            box-sizing: border-box;
        }
        
        @media (max-width: 768px) {
            .explorer-grid {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
        
        .key-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .key-item {
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s;
            border: 1px solid transparent;
            word-break: break-all;
        }
        
        .key-item:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .key-item.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
        }
        
        .json-viewer {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 1rem;
            overflow-y: auto;
            height: 100%;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            color: #e2e8f0;
        }

        .footer {
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .live-indicator {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body>
    <h1>KV Telemetry Dashboard</h1>
    <p class="subtitle" id="uptime">Uptime: 0h 0m</p>
    
    <div class="dashboard">
        <div class="card metric-card hits">
            <div class="card-title">L1 Memory Hits</div>
            <div class="card-value" id="l1Hits">0</div>
            <div class="card-title" style="margin-top: 0.5rem; font-size: 0.75rem; text-transform: none;">Saved KV Reads</div>
        </div>

        <div class="card metric-card reads">
            <div class="card-title">Cloudflare KV Reads</div>
            <div class="card-value" id="kvReads">0</div>
        </div>

        <div class="card metric-card writes">
            <div class="card-title">Cloudflare KV Writes</div>
            <div class="card-value" id="kvWrites">0</div>
        </div>
    </div>
    
    <div class="charts-container">
        <div class="card">
            <div class="card-title">Real-Time Operations</div>
            <div class="chart-wrapper">
                <canvas id="lineChart"></canvas>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Cache Efficiency Ratio</div>
            <div class="chart-wrapper">
                <canvas id="donutChart"></canvas>
            </div>
        </div>
    </div>
    
    <div class="cache-explorer">
        <div class="cache-header">
            <h2>Live Cache Explorer</h2>
            <div style="display: flex; gap: 1rem;">
                <button id="loadL1Btn">View L1 Cache</button>
                <button id="loadKVBtn" style="background: linear-gradient(135deg, #f59e0b, #d97706);">View Cloudflare KV</button>
            </div>
        </div>
        
        <div class="explorer-grid">
            <div class="card key-list" id="keyList">
                <div style="color: var(--text-muted); text-align: center; padding: 2rem;">
                    Click 'Load Live Cache Data' to scan L1 RAM.
                </div>
            </div>
            <div class="card" style="padding: 0; overflow: hidden;">
                <div class="json-viewer" id="jsonViewer" style="border-radius: 16px;">Select a key to view uncompressed data.</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <span class="live-indicator"></span>
        Metrics live updating every 2s
    </div>

    <script>
        // Chart.js Configuration
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = "'Inter', sans-serif";
        
        const lineCtx = document.getElementById('lineChart').getContext('2d');
        const donutCtx = document.getElementById('donutChart').getContext('2d');
        
        const maxDataPoints = 30; // 60 seconds (2s interval)
        const timeLabels = Array(maxDataPoints).fill('');
        
        const lineChart = new Chart(lineCtx, {
            type: 'line',
            data: {
                labels: timeLabels,
                datasets: [
                    {
                        label: 'L1 Hits',
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        data: Array(maxDataPoints).fill(0)
                    },
                    {
                        label: 'KV Reads',
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        data: Array(maxDataPoints).fill(0)
                    },
                    {
                        label: 'KV Writes',
                        borderColor: '#8b5cf6',
                        backgroundColor: 'rgba(139, 92, 246, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        data: Array(maxDataPoints).fill(0)
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 },
                scales: {
                    x: { display: false },
                    y: { 
                        beginAtZero: true,
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    }
                },
                plugins: { legend: { position: 'top' } }
            }
        });
        
        const donutChart = new Chart(donutCtx, {
            type: 'doughnut',
            data: {
                labels: ['L1 Hits', 'KV Reads'],
                datasets: [{
                    data: [1, 1],
                    backgroundColor: ['#10b981', '#3b82f6'],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });

        let prevStats = null;
        
        async function fetchStats() {
            try {
                const res = await fetch('/api/kv-stats');
                if (!res.ok) {
                    if(res.status === 401) window.location.href = '/einthusan-gate';
                    return;
                }
                const data = await res.json();
                
                // Update Top Cards
                document.getElementById('kvReads').innerText = data.kvReads;
                document.getElementById('kvWrites').innerText = data.kvWrites;
                document.getElementById('l1Hits').innerText = data.l1Hits;
                
                // Uptime
                const totalSeconds = Math.floor((Date.now() - data.startTime) / 1000);
                document.getElementById('uptime').innerText = `Uptime: ${Math.floor(totalSeconds / 3600)}h ${Math.floor((totalSeconds % 3600) / 60)}m`;

                // Update Line Chart (Deltas)
                if (prevStats) {
                    const deltaHits = data.l1Hits - prevStats.l1Hits;
                    const deltaReads = data.kvReads - prevStats.kvReads;
                    const deltaWrites = data.kvWrites - prevStats.kvWrites;
                    
                    lineChart.data.datasets[0].data.shift();
                    lineChart.data.datasets[0].data.push(deltaHits);
                    
                    lineChart.data.datasets[1].data.shift();
                    lineChart.data.datasets[1].data.push(deltaReads);
                    
                    lineChart.data.datasets[2].data.shift();
                    lineChart.data.datasets[2].data.push(deltaWrites);
                    
                    lineChart.update();
                }
                prevStats = data;
                
                // Update Donut Chart
                donutChart.data.datasets[0].data = [data.l1Hits || 1, data.kvReads || 1];
                donutChart.update();

            } catch (e) {
                console.error('Error fetching stats:', e);
            }
        }

        // Cache Explorer Logic
        let cacheData = {};
        let currentMode = 'L1'; // 'L1' or 'KV'
        
        const loadL1Btn = document.getElementById('loadL1Btn');
        const loadKVBtn = document.getElementById('loadKVBtn');
        const keyList = document.getElementById('keyList');
        const jsonViewer = document.getElementById('jsonViewer');

        loadL1Btn.addEventListener('click', async () => {
            loadL1Btn.innerText = 'Scanning RAM...';
            loadL1Btn.style.opacity = '0.7';
            currentMode = 'L1';
            try {
                const res = await fetch('/api/cache-explorer');
                if (!res.ok) throw new Error('Failed to fetch cache');
                cacheData = await res.json();
                
                renderKeyList();
                jsonViewer.innerText = 'Select an L1 Cache key to view data.';
            } catch (err) {
                console.error(err);
                jsonViewer.innerText = 'Error loading L1 cache data.';
            } finally {
                loadL1Btn.innerText = 'View L1 Cache';
                loadL1Btn.style.opacity = '1';
            }
        });
        
        loadKVBtn.addEventListener('click', async () => {
            loadKVBtn.innerText = 'Fetching CF Keys...';
            loadKVBtn.style.opacity = '0.7';
            currentMode = 'KV';
            try {
                const res = await fetch('/api/kv-keys');
                if (!res.ok) throw new Error('Failed to fetch KV keys');
                const data = await res.json();
                
                // For KV, cacheData is just an object with null values initially
                cacheData = {};
                if (data.keys) {
                    data.keys.forEach(k => cacheData[k] = null);
                }
                
                renderKeyList();
                jsonViewer.innerText = 'Select a Cloudflare KV key to fetch its value remotely.';
            } catch (err) {
                console.error(err);
                jsonViewer.innerText = 'Error loading KV keys.';
            } finally {
                loadKVBtn.innerText = 'View Cloudflare KV';
                loadKVBtn.style.opacity = '1';
            }
        });
        
        function renderKeyList() {
            keyList.innerHTML = '';
            const keys = Object.keys(cacheData);
            
            if (keys.length === 0) {
                keyList.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 2rem;">No keys found.</div>';
                return;
            }
            
            keys.forEach(key => {
                const div = document.createElement('div');
                div.className = 'key-item';
                div.innerText = key;
                div.onclick = async () => {
                    document.querySelectorAll('.key-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    
                    if (currentMode === 'L1') {
                        const val = cacheData[key];
                        jsonViewer.innerText = typeof val === 'object' ? JSON.stringify(val, null, 2) : val;
                    } else if (currentMode === 'KV') {
                        jsonViewer.innerText = 'Fetching from Cloudflare KV...';
                        try {
                            const res = await fetch('/api/kv-value/' + encodeURIComponent(key));
                            const data = await res.json();
                            if (data.error) {
                                jsonViewer.innerText = 'Error: ' + data.error;
                            } else {
                                jsonViewer.innerText = typeof data.value === 'object' ? JSON.stringify(data.value, null, 2) : data.value;
                            }
                        } catch (err) {
                            jsonViewer.innerText = 'Network error fetching KV value.';
                        }
                    }
                };
                keyList.appendChild(div);
            });
        }

        // Initialize
        fetchStats();
        setInterval(fetchStats, 2000);
    </script>
</body>
</html>
